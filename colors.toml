mode = "light"

# Solstice Crimson — built on the original Solaris CDE "Crimson4" palette
# (palettes/Crimson4.dp in netrunner01/cde; also in NsCDE's collection).
# A genuinely distinct member of the CDE Crimson family: deep crimson rose,
# sage-green chrome, warm sand canvas, deeper steel for recessed surfaces.
#
# Rose     #A93F6C  selection, active titlebar, focus, hover (slot 1, exact)
# Chrome   #9CB9AF  sage-grey panels, bars, menubars (slot 2, exact)
# Steel    #65819C  troughs, recessed surfaces, inactive border (slot 3, exact)
# Canvas   #F2E9D9  warm sand terminal / text-editor background (slot 4, exact)
#
# Terminal templates bind to 'background', which carries the sand canvas;
# desktop chrome stays via hand-pinned gtk css and the wallpaper base.
# color0/color7 are pinned to background/foreground by the resolver.

# ── Structure ────────────────────────────────────────────────────────────────
accent               = "#A93F6C"
selection            = "#A93F6C"
selection_background = "#A93F6C"
selection_foreground = "#FFFFFF"

background           = "#F2E9D9"
dark_background      = "#65819C"
darker_background    = "#53635E"
lighter_background   = "#D5E1DD"

foreground           = "#000000"
dark_foreground      = "#4A5953"
light_foreground     = "#4A5953"

# Semantic colors without a color0..color15 slot.
orange               = "#A74D1A"   # battery/low indicators; not yellow
brown                = "#786349"

# ── Hyprland borders ───────────────────────────────────────────────────────
hyprland_active_border   = "#A93F6C"
hyprland_inactive_border = "#65819C"

# ── ANSI 16-color palette (canonical) ──────────────────────────────────────
# Yellows are hue-preserved darkenings of the CDE-extracted ambers, meeting
# 4.5:1 (color3, color11) on the sand canvas.
color0  = "#F2E9D9"   # black   (pinned to background/canvas by the resolver)
color1  = "#BA3B3B"   # red
color2  = "#426D51"   # green
color3  = "#836527"   # yellow
color4  = "#476899"   # blue
color5  = "#A93F6C"   # magenta (rose accent)
color6  = "#466B6B"   # cyan
color7  = "#000000"   # white   (ink — foreground)
color8  = "#4A5953"   # br black  (muted)
color9  = "#BC3535"   # br red
color10 = "#4A7157"   # br green
color11 = "#7C631E"   # br yellow
color12 = "#496998"   # br blue
color13 = "#B43E72"   # br magenta
color14 = "#4C7070"   # br cyan
color15 = "#000000"   # br white  (bright foreground)
